# Alleadz CI — server (vitest + scratch PG via /tmp socket) + client (vitest) + build gate
# Generated from github-actions-cicd skill templates (2026-10-02)
# Laws applied: least-privilege permissions, pinned SHAs, timeout-minutes, role separation.
# The scratch-db harness models prod (app connects as non-superuser `alleadz_app` role so
# FORCE RLS bites) ONLY when a Postgres unix socket exists at /tmp/.s.PGSQL.5432. So we run
# a real server-side postgres on the runner (socket in /tmp), not a docker service —
# otherwise the harness falls back to a superuser connection and the harness-law test
# correctly fails (caught on the first CI run, kept as the guard).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.0.0
        with:
          persist-credentials: false

      - name: Install Postgres (server on /tmp socket, trust auth)
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql
          PGVER="$(ls /etc/postgresql | head -1)"
          sudo pg_createcluster "$PGVER" main --start-conf auto 2>/dev/null || true
          # single socket dir, set at cluster level (pg_ctlcluster parses this key itself,
          # so avoid multi-value lists in postgresql.conf)
          sudo pg_conftool "/etc/postgresql/${PGVER}/main/postgresql.conf" set unix_socket_directories '/tmp'
          sudo pg_ctlcluster "$PGVER" main start
          for i in $(seq 1 30); do
            if pg_isready -h /tmp -p 5432; then break; fi
            [ "$i" = 30 ] && { echo "postgres never became ready"; exit 1; }
            sleep 1
          done

      - uses: actions/setup-node@54337e0d02de9202d0948aaff36ad556375497b9 # main (2026-10-02)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci
        working-directory: server

      - name: Tests (scratch-db harness, role-separated)
        run: npm test
        working-directory: server

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@54337e0d02de9202d0948aaff36ad556375497b9 # main (2026-10-02)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci
        working-directory: client

      - name: Unit tests
        run: npm test
        working-directory: client

      - name: Build gate
        run: npm run build
        working-directory: client
